# SAGE engine default strings (English). Worlds override any key in lexicon/<locale>.yaml.
# Keep these generic: no setting, genre or world names (brief invariants 2 and 3).

prompt: "\r\n> "

login:
  banner: ""
  motd: ""

onboarding:
  new_player: "\r\nNew here? Type 'help' to see what you can do."

parser:
  rate_limited: "Slow down — commands are arriving faster than the world can act."
  command_error: "An error occurred while processing your command."
  unknown_command: "Unknown command: '{verb}'.{hint} Type 'help' for assistance."
  did_you_mean: " Did you mean: {suggestions}?"

help:
  header: "--- Available Commands ---"
  no_such_command: "No command called '{verb}'. Plain 'help' lists them all."
  no_description: "No description."
  entry: "{verb}{aliases}\r\n  {doc}"
  entry_aliases: " (aliases: {aliases})"
  row: "{label} - {summary}"
  row_label: "{verb} ({aliases})"

who:
  empty: "Nobody is connected."
  header: "Online ({count}):"
  row: "  {name}"

death:
  wake: "\r\nYou come to, patched up and aching.{bill}"
  bill: " Recovery cost you {amount} {currency}."
  no_bill: " You had nothing to pay with; you were patched up anyway."

session:
  not_authenticated: "Not authenticated."
  goodbye: "Goodbye!"
  replaced: "\r\nThis character just signed in from another connection. Goodbye."
  broadcast: "[Server] {message}"

# What a player is told when staff change their character from the admin console.
restart:
  warning: "
[Server] The server restarts in {when}. Find a safe place; your character is saved first."
  reason: "({reason})"
  cancelled: "
[Server] The restart has been cancelled."
  now: "
[Server] Restarting now. Your character is being saved."
  goodbye: "The server is restarting. Please reconnect in a moment."
  minutes: "{n} minutes"
  one_minute: "1 minute"
  seconds: "{n} seconds"
moderation:
  muted: "
You are muted and cannot talk right now."
  muted_now: "
Staff have muted you. You cannot say, emote or tell for now."
  unmuted: "
Staff lifted your mute. You can talk again."
report:
  usage: "
Usage: report <what happened>. Say what you saw and where; your location is sent with it."
  thanks: "
Thanks. Your report #{id} is with the staff."
  too_soon: "
You sent a report a moment ago. Please wait a little before sending another."
staff:
  moved: "
A member of staff has moved you."
  wallet: "
Staff set your {currency} to {amount}."
  item_given: "
Staff gave you {item}."
  item_removed: "
Staff took {item} from you."
  restored: "
Staff restored you to full health."
  restored_snapshot: "
Staff put your character back to an earlier save."
  kicked: "
You have been disconnected by staff."

void:
  lost: "You are lost in the void."
  nowhere: "You are in the void."
  collapsing: "The world is collapsing around you."
  no_speaking: "You can't speak in the void."

look:
  header: "\r\n{name} [ {id} ]"
  header_unnamed: "\r\n[ {id} ]"
  scene: "\r\nThe scene: {text}"
  exits: "Exits: {exits}"
  also_here: "Also here: {names}"
  entities: "Entities: {names}"
  floor_items: "Items on floor: {names}"
  something: "something"

map:
  nowhere: "You are nowhere mappable."
  no_chart: "No chart exists for this place."
  zone: "--- {zone} ---"
  here: "  [@] {name}"
  explored: "  [*] {name}"
  unexplored: "  ...and {count} places you haven't found yet."
  legend: "@ you are here · * explored"

say:
  what: "Say what?"
  self: "You say: \"{message}\""
  others: "{name} says: \"{message}\""

emote:
  what: "Emote what? Usage: emote <does something>"
  nobody: "There is nobody here to see it."
  line: "{name} {action}"

tell:
  usage: "Tell whom what? Usage: tell <player> <message>"
  self: "You mutter to yourself. It doesn't help."
  which: "Which one? {names}"
  nobody: "No one called '{name}' is online."
  what: "Tell {name} what?"
  sent: "You tell {name}: \"{message}\""
  received: "{name} tells you: \"{message}\""

move:
  cannot: "You cannot go {direction}."
  moved: "You move {direction}."
  leaves: "{name} leaves {direction}."
  arrives_from: "{name} arrives from the {side}."
  arrives: "{name} arrives."
  note: "\r\n{text}"

items:
  unnamed: "item"
  unknown: "unknown item"

inventory:
  empty: "You are carrying nothing."
  header: "\r\n--- Inventory ---"
  row: "  {name}"

take:
  what: "Take what? Usage: take <item>"
  missing: "You see no '{name}' here."
  done: "You pick up the {name}."

drop:
  what: "Drop what? Usage: drop <item>"
  missing: "You are not carrying '{name}'."
  done: "You drop the {name}."

examine:
  what: "Examine what?"
  text: "\r\n{text}"
  exit_open: "The way {direction} is open."
  person: "\r\n{name} {condition}."
  unhurt: "looks unhurt"
  scraped: "has a few scrapes"
  hurt: "is badly hurt"
  barely: "is barely standing"
  hp: "[HP: {hp}/{max_hp}]"
  floor_item: "An item."
  carried_item: "An item you are carrying."
  nothing_with_hints: "You see nothing notable called '{name}'. Worth a look: {names}."
  nothing: "You see nothing notable called '{name}'. Nothing here rewards a closer look."

chargen:
  attributes:
    title: "Attributes"

