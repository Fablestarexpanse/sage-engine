# Attributes a character has, their vitals, and how many points character creation hands out.
# Labels are lexicon keys (lexicon/en.yaml), so renaming a stat never touches this file.
attributes:
  - {key: physical, label: stat.physical.name, short: stat.physical.short, min: 1, max: 6, default: 2}
  - {key: mental, label: stat.mental.name, short: stat.mental.short, min: 1, max: 6, default: 2}
  - {key: social, label: stat.social.name, short: stat.social.short, min: 1, max: 6, default: 2}
vitals:
  - {key: hp, label: vital.hp.name, default_max: 10}
chargen:
  attribute_points: 8
