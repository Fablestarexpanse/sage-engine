# Engine tests run from the repository root: during the SAGE transition they read world
# content from <root>/content and deployment config from <root>/config.
[pytest]
testpaths = engine/tests worlds
# World plugin tests import the engine's test helpers (tests.fakes, tests.plugins.conftest).
pythonpath = engine
markers =
    live: needs real Postgres and Redis; runs only when SAGE_LIVE_TESTS=1
