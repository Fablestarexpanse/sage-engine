# Copy to comfyui.toml and adjust for your ComfyUI install.
# comfyui.toml is gitignored — never commit API tokens or local paths here.
enabled = false
base_url = "http://127.0.0.1:8188"

# Empty: the world's ai/comfyui/portrait.json; set a path to override it.
workflow_path = ""
positive_prompt_node_id = "57"
output_node_id = "40"

# Empty: the world's ai/comfyui/area.json.
area_workflow_path = ""
area_positive_prompt_node_id = "16"
area_output_node_id = "17"

# checkpoint_name = "your-model.safetensors"

timeout_seconds = 600.0
poll_interval_seconds = 0.75

economy_enabled = true
starting_ai_credits = 50
portrait_generation_cost = 3
area_generation_cost = 3
character_create_portrait_cost = 3
currency_display_name = "credits"
credits_per_usd = 100

# Purchase bundles staff can grant from the admin console (Players & accounts). Pricing is this
# deployment's business; with no entries the console offers only a manual credit amount.
[[credit_bundles]]
id = "starter"
label = "$4.99"
credits = 500
blurb = "~100 credits/$"

[[credit_bundles]]
id = "standard"
label = "$9.99"
credits = 1000
blurb = "100 credits/$"

[[credit_bundles]]
id = "plus"
label = "$19.99"
credits = 2200
blurb = "+10% vs straight rate"

[[credit_bundles]]
id = "best"
label = "$49.99"
credits = 5750
blurb = "+15% vs straight rate"
