name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.lock
            engine/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r engine/requirements.lock
          python -m pip install -e "./engine[dev]"

      - name: Format
        run: python -m ruff format --check engine/src engine/tests plugins worlds

      - name: Build
        run: python -m compileall -q engine/src engine/tests

      - name: Lint
        run: python -m ruff check engine/src engine/tests plugins worlds

      - name: SAGE invariant ratchet
        run: |
          python -m ruff check scripts/sage_invariants.py scripts/license_report.py
          python -m ruff format --check scripts/sage_invariants.py scripts/license_report.py
          python scripts/sage_invariants.py check

      - name: Test
        run: python -m pytest -q

  worldforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/tools/worldforge/package-lock.json

      - name: Install dependencies
        working-directory: engine/tools/worldforge
        run: npm ci

      - name: Test
        working-directory: engine/tools/worldforge
        run: npm test

  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway service-container credentials, not secrets.
      SAGE_LIVE_TESTS: "1"
      SAGE_DATABASE__HOST: localhost
      SAGE_DATABASE__USER: sage
      SAGE_DATABASE__PASSWORD: sage-ci
      SAGE_REDIS__HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.lock
            engine/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r engine/requirements.lock
          python -m pip install -e "./engine[dev]"

      - name: Live tests (Postgres + Redis)
        run: python -m pytest -q -m live

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.lock

      - name: Install runtime dependencies only
        run: python -m pip install -r engine/requirements.lock

      - name: License report and policy
        run: python scripts/license_report.py --require-cargo --out license-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.md
          if-no-files-found: ignore
