# Rivermoot — the second SAGE reference world (docs/sage/BRIEF.md section 6).
# Deliberately unlike Fablestar: low-fantasy river town, three attributes, one currency,
# simple levels instead of a proficiency tree, no agents, no AI images. It exists to prove the
# engine's seams, not to be a product.

[world]
id = "rivermoot"
name = "Rivermoot"
version = "0.1.0"
engine = ">=0.2,<0.3"
locale = "en"

[start]
room = "town:bridge"
respawn = "town:shrine"

[content]
room_types = ["street", "square", "shrine", "inn", "shop", "riverbank", "dock", "hut", "field",
              "cellar", "road", "mill", "marsh"]
exit_dirs = ["north", "south", "east", "west"]
equipment_slots = ["hand", "body"]

[plugins]
combat = "^1"
levels = "^1"
equipment = "^1"
consumables = "^1"
shop = "^1"
lodging = "^1"
search = "^1"
effects = "^1"
ambient = "^1"
hazards = "^1"

[params]
"levels.xp_per_kill" = 5
"levels.xp_per_level" = 10
"levels.hp_per_level" = 2
"effects.rest_room_types" = ["shrine", "inn"]
# The river shrine asks up to 3 silver of whoever wakes there, and they wake at half health.
"engine.death.respawn_bill_max" = 3
"engine.death.respawn_hp_fraction" = 0.5
