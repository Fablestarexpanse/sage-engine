[workspace]
resolver = "3"
members = ["crates/*"]
# Built to wasm with their own workspaces, by sage-build.
exclude = ["crates/sage-build/test-plugins", "crates/sage-schema/wasm", "plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Fablestarexpanse/sage-engine"

[workspace.dependencies]
sage-core = { path = "crates/sage-core" }
sage-store = { path = "crates/sage-store" }
sage-schema = { path = "crates/sage-schema" }
sage-host = { path = "crates/sage-host" }
sage-build = { path = "crates/sage-build" }
sage-agents = { path = "crates/sage-agents" }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
