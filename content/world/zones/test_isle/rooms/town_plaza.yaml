    destination: test_isle:south_road
    description: ''
  east:
    destination: test_isle:clinic
    description: ''
  north:
    destination: test_isle:market_square
    description: ''
  west:
    destination: aipub:pub_entrance
    description: The AIpub's sign glows over a well-worn door — beer, beds, and island gossip.
