[package]
name = "sage-server"
description = "SAGE server binary and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sage"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sage-agents.workspace = true
sage-core.workspace = true
sage-host.workspace = true
sage-schema.workspace = true
sage-store.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
ctrlc = "3.5"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rusqlite.workspace = true
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net"] }
sage-build.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
