# Test plugins. Built to wasm32-unknown-unknown by the sage-build crate and wrapped
# into components there. Not part of the main workspace and never shipped.
[workspace]
resolver = "3"
members = ["mover", "spinner", "hog", "forger", "impostor"]

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
wit-bindgen = "0.62"
serde_json = "1"

[profile.release]
opt-level = "s"
debug = false
